<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JLPT N5 Premium Flashcards</title>
    
    <!-- Premium Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Noto+Sans+Bengali:wght@500;700&family=Noto+Sans+JP:wght@700;900&display=swap" rel="stylesheet">
    
    <!-- Link to external CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container">
    
    <!-- SCREEN 1: DASHBOARD -->
    <div id="dashboard">
        <div class="dashboard-header">
            <a href="../index.html" class="root-back-link">← Home</a>
            <h1 style="font-size: 1.3rem; margin-top: 15px;">JLPT N5 VOCABULARY</h1>
        </div>
        
        <button class="btn-master" onclick="startSession('master')">
            Master Deck<br><span style="font-size: 0.8rem; font-weight: 600; opacity: 0.9;">All Lessons</span>
        </button>

        <div class="lesson-grid" id="lesson-buttons-container">
            <!-- Buttons generated by JavaScript -->
        </div>
    </div>

    <!-- SCREEN 2: STUDY SESSION -->
    <div id="study-screen" class="hidden">
        <div class="study-header">
            <div class="study-header-top">
                <button class="btn-back" onclick="goHome()">&#8592; Back</button>
                <h2 id="study-title">Lesson X</h2>
                <div class="header-spacer"></div>
            </div>
            
            <div class="progress-wrapper">
                <div class="progress-fill" id="progress-bar"></div>
            </div>
        </div>

        <div class="card-container" onclick="showAnswer()">
            <div class="flashcard" id="flashcard">
                <div class="card-face card-front">
                    <div class="jp-word" id="front-jp"></div>
                    <div class="hint">Tap to flip</div>
                </div>
                <div class="card-face card-back">
                    <div class="jp-word-small" id="back-jp"></div>
                    <div class="bn-meaning" id="back-bn"></div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button id="show-answer-btn" class="btn-main" onclick="showAnswer()">Show Answer</button>
            <div id="rating-controls" class="rating-grid hidden">
                <button class="btn-rate bg-again" onclick="gradeCard('again', event)">
                    <span class="interval">1m</span><span class="label">Again</span>
                </button>
                <button class="btn-rate bg-hard" onclick="gradeCard('hard', event)">
                    <span class="interval">12h</span><span class="label">Hard</span>
                </button>
                <button class="btn-rate bg-good" onclick="gradeCard('good', event)">
                    <span class="interval">1d</span><span class="label">Good</span>
                </button>
                <button class="btn-rate bg-easy" onclick="gradeCard('easy', event)">
                    <span class="interval">4d</span><span class="label">Easy</span>
                </button>
            </div>
        </div>
    </div>

    <!-- SCREEN 3: SUMMARY -->
    <div id="summary-screen" class="hidden">
        <div class="summary-card">
            <h2>Session Complete! 🎉</h2>
            <div class="accuracy-circle" id="accuracy-chart">
                <span class="accuracy-text" id="accuracy-display">0%</span>
            </div>
            <p class="stats-text">You answered <b id="correct-count">0</b> out of <b id="total-count">0</b> correctly.</p>
            <button class="btn-main" onclick="goHome()">Back to Decks</button>
        </div>
    </div>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2026 Built by <a href="https://www.moniruzzamaan.com/" target="_blank" rel="noopener noreferrer" class="credit-link">Moniruzzaman</a>. All rights reserved.</p>
    </footer>

</div>

<!-- Link to external JS -->
<script src="script.js"></script>
</body>
</html>
